# Private ISU v2 - Production Nginx Configuration (Non-Docker)

# アップストリーム設定（ロードバランシング対応）
upstream private_isu_app {
    # Keep-Alive接続プール
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
    
    # アプリケーションサーバー（localhost:8080）
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;  # 本番では具体的なドメイン名に変更
    
    # セキュリティヘッダー
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # ログ設定
    access_log /var/log/nginx/private_isu_access.log;
    error_log /var/log/nginx/private_isu_error.log;
    
    # gzip圧縮設定
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # 静的ファイルの配信設定（高度なキャッシュ）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        root /home/isucon/private_isu/webapp/public;  # 本番環境のパスに調整
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        
        # ETags を有効化
        etag on;
        
        # ファイルが見つからない場合はアプリケーションに転送
        try_files $uri @app;
    }
    
    # 画像配信の最適化（ファイルシステム優先）
    location ~* ^/image/(\d+)\.(jpg|jpeg|png|gif)$ {
        # 画像ファイルの直接配信を試行
        try_files /var/www/images/$1.$2 @app;
        
        # キャッシュ設定
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        etag on;
    }
    
    # メインアプリケーション
    location @app {
        proxy_pass http://private_isu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep-Alive設定
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # タイムアウト設定
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # バッファリング最適化
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # API エンドポイント（通常のプロキシ）
    location / {
        proxy_pass http://private_isu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep-Alive設定
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # タイムアウト設定
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # バッファリング最適化
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # レスポンス圧縮
        gzip_proxied any;
    }
    
    # ヘルスチェック
    location /health {
        proxy_pass http://private_isu_app/health;
        access_log off;
    }
    
    # nginx ステータス（監視用、localhost限定）
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    # セキュリティ設定
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 不要なファイルへのアクセス拒否
    location ~* \.(bak|swp|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
} 