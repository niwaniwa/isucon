[project]
name = "private-isu"
version = "0.1.0"
description = "private-isu webapp implementation for Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.1.0",
    "aiomysql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.10.0", 
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=24.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Legacy Flask dependencies (for migration)
    "flask>=3.1.0",
    "flask-session[memcached]>=0.8.0",
    "gunicorn>=23.0.0",
    "mysqlclient~=2.2.7",
    "pymemcache>=4.0.0",
]
