server {
  listen 80;

  client_max_body_size 10m;
  root /public/;

  # Static image serving with fallback to app
  location ~ ^/image/(\d+)\.(jpg|png|gif)$ {
    # First, try to serve the file from disk
    try_files /image/$1.$2 @app_image;
    
    # Cache headers for static files
    expires 1d;
    add_header Cache-Control "public, immutable";
    add_header X-Served-By "nginx-static";
  }

  # Fallback location for images not found on disk
  location @app_image {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://app:8080;
    
    # Don't cache the fallback response itself
    add_header X-Served-By "app-fallback";
  }

  # CSS and JS files
  location ~ \.(css|js)$ {
    expires 1d;
    add_header Cache-Control "public, immutable";
  }

  # All other requests go to the app
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://app:8080;
  }
}